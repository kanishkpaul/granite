<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
    <title>granite editor</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff; --text: #1d1d1f; --muted: #86868b; --accent: #6a4fd4;
        --selection: rgba(106, 79, 212, 0.22); --code: rgba(0, 0, 0, 0.05);
        --tag: rgba(106, 79, 212, 0.1); --callout: rgba(106, 79, 212, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1e1e1e; --text: #e8e8ed; --muted: #8e8e93; --accent: #a28df0;
          --selection: rgba(162, 141, 240, 0.3); --code: rgba(255, 255, 255, 0.07);
          --tag: rgba(162, 141, 240, 0.15); --callout: rgba(162, 141, 240, 0.08);
        }
      }
      html, body, #editor { margin: 0; height: 100%; background: var(--background); }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
