# XcodeGen spec. Never edit granite.xcodeproj by hand: edit this file and run `xcodegen`.
name: granite
options:
  bundleIdPrefix: local.granite
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  KBCore:
    path: Packages/KBCore
  KBIndex:
    path: Packages/KBIndex

targets:
  granite:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: KBCore
      - package: KBIndex
    settings:
      base:
        PRODUCT_NAME: granite
        PRODUCT_BUNDLE_IDENTIFIER: local.granite.app
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: granite
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Non-sandboxed by design (master plan §3): shells out to git and extractors.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
